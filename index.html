<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JasonOS — Digital Office Status</title>
<style>
  /* ── Custom properties ───────────────────────────────────────── */
  :root {
    --bg:          #0d0d0d;
    --surface:     #1a1a1a;
    --surface-2:   #242424;
    --border:      #2e2e2e;
    --text:        #f2f2f2;
    --text-muted:  #a0a0a0;
    --text-dim:    #6a6a6a;
    --accent:      #4a9eff;
    --warn:        #ff9f40;
    --danger:      #ff5f5f;
    --success:     #4caf7d;
    --radius:      10px;
    --gap:         14px;
  }

  /* ── Reset ───────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 17px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Auth overlay ────────────────────────────────────────────── */
  #auth-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    gap: 20px;
  }

  #auth-overlay h1 {
    font-size: 1.1rem;
    font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  #auth-form {
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 12px;
    width: min(300px, 80vw);
  }

  #auth-input {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 1rem;
    padding: 12px 16px;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  #auth-input:focus { border-color: var(--accent); }

  #auth-btn {
    background: var(--accent);
    border: none;
    border-radius: var(--radius);
    color: #fff;
    cursor: pointer;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 12px;
    -webkit-appearance: none;
    appearance: none;
  }

  #auth-error {
    color: var(--danger);
    font-size: 0.85rem;
    text-align: center;
    min-height: 1.2em;
  }

  /* ── Main layout ─────────────────────────────────────────────── */
  #app {
    display: none;
    flex-direction: column;
    min-height: 100vh;
    padding: var(--gap);
    gap: var(--gap);
    max-width: 600px;
    margin: 0 auto;
  }

  /* ── Header strip ────────────────────────────────────────────── */
  #header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 8px;
  }

  #header-title {
    font-size: 0.75rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  #header-meta {
    text-align: right;
    font-size: 0.72rem;
    color: var(--text-muted);
    line-height: 1.6;
  }

  #staleness-badge {
    display: none;
    font-size: 0.7rem;
    font-weight: 600;
    background: var(--warn);
    color: #000;
    padding: 2px 7px;
    border-radius: 4px;
    margin-top: 4px;
  }

  /* ── Cards ───────────────────────────────────────────────────── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }

  .panel-label {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 10px;
  }

  /* ── CEO Actions ─────────────────────────────────────────────── */
  #ceo-actions-panel { border-color: var(--warn); }
  #ceo-actions-panel .panel-label { color: var(--warn); }
  #ceo-actions-panel.empty { border-color: var(--border); }
  #ceo-actions-panel.empty .panel-label { color: var(--text-dim); }

  .action-card {
    background: var(--surface-2);
    border-left: 3px solid var(--warn);
    border-radius: 6px;
    padding: 10px 12px;
    margin-bottom: 8px;
  }
  .action-card:last-child { margin-bottom: 0; }

  /* Low-priority cards: muted border, slightly reduced opacity */
  .action-card.priority-low  { border-left-color: var(--border); opacity: 0.8; }
  /* Confirm/info cards: accent-blue border */
  .action-card.priority-confirm { border-left-color: var(--accent); }

  /* ── Action category badges ──────────────────────────────────── */
  /* Base badge style (shared) */
  .action-category {
    display: inline-block;
    font-size: 0.63rem;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 3px;
    margin-bottom: 5px;
  }
  /* required — orange/warn; high-contrast background */
  .badge-required {
    background: rgba(255, 159, 64, 0.15);
    color: var(--warn);
  }
  /* low — dim; visually receded */
  .badge-low {
    background: rgba(106, 106, 106, 0.15);
    color: var(--text-dim);
  }
  /* confirm / info — accent blue */
  .badge-confirm,
  .badge-info {
    background: rgba(74, 158, 255, 0.12);
    color: var(--accent);
  }
  /* action — neutral fallback for portfolio-sourced items */
  .badge-action {
    background: rgba(76, 175, 125, 0.12);
    color: var(--success);
  }

  .action-label {
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
  }

  .action-context {
    font-size: 0.82rem;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .no-actions {
    font-size: 0.85rem;
    color: var(--text-muted);
  }

  /* ── Ops strip ───────────────────────────────────────────────── */
  #ops-strip {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
  }

  .ops-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 6px;
    text-align: center;
  }

  .ops-value {
    font-size: 1.15rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text);
    line-height: 1.2;
  }
  .ops-value.accent  { color: var(--accent); }
  .ops-value.success { color: var(--success); }
  .ops-value.warn    { color: var(--warn); }
  .ops-value.muted   { color: var(--text-muted); }

  .ops-label {
    font-size: 0.63rem;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-top: 4px;
    line-height: 1.3;
  }

  /* ── Active Initiative ───────────────────────────────────────── */
  #active-panel .initiative-id {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    color: var(--accent);
    margin-bottom: 4px;
  }

  #active-panel .initiative-name {
    font-size: 1rem;
    font-weight: 500;
    color: var(--text);
  }

  #active-panel .initiative-status {
    display: inline-block;
    font-size: 0.68rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 2px 7px;
    border-radius: 4px;
    margin-top: 6px;
  }

  .status-active { background: rgba(74, 158, 255, 0.15); color: var(--accent); }
  .status-next   { background: rgba(76, 175, 125, 0.15); color: var(--success); }
  .status-none   { color: var(--text-muted); font-size: 0.85rem; }

  /* ── Queue ───────────────────────────────────────────────────── */
  .queue-item {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 6px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.875rem;
  }
  .queue-item:last-child  { border-bottom: none; padding-bottom: 0; }
  .queue-item:first-child { padding-top: 0; }

  .queue-pos  { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); min-width: 18px; text-align: right; }
  .queue-id   { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); min-width: 60px; }
  .queue-name { color: var(--text); flex: 1; font-weight: 500; }
  .queue-empty { font-size: 0.9rem; color: var(--text-muted); }

  /* ── Director Activity ───────────────────────────────────────── */
  .director-row {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .director-row:last-child  { border-bottom: none; padding-bottom: 0; }
  .director-row:first-child { padding-top: 0; }

  .director-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .director-dot.active  { background: var(--success); }
  .director-dot.dormant { background: var(--text-dim); }

  .director-name {
    flex: 1;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--text);
  }
  .director-name.dormant { color: var(--text-muted); }

  .director-date {
    font-size: 0.8rem;
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    min-width: 60px;
    text-align: right;
  }

  .director-count {
    font-size: 0.75rem;
    color: var(--text-dim);
    min-width: 24px;
    text-align: right;
  }

  /* ── Error state ─────────────────────────────────────────────── */
  #load-error {
    display: none;
    background: rgba(255, 95, 95, 0.08);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 14px 16px;
    font-size: 0.85rem;
    color: var(--danger);
  }

  /* ── Backlog panels ──────────────────────────────────────────── */
  .backlog-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 5px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.825rem;
  }
  .backlog-item:last-child  { border-bottom: none; padding-bottom: 0; }
  .backlog-item:first-child { padding-top: 0; }

  .backlog-id        { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); min-width: 60px; padding-top: 1px; }
  .backlog-name-wrap { flex: 1; }
  .backlog-name      { color: var(--text-muted); font-size: 0.875rem; display: block; }
  .backlog-note      { color: var(--text-dim); font-size: 0.75rem; margin-top: 2px; display: block; }
  .backlog-empty     { font-size: 0.875rem; color: var(--text-dim); }

  /* ── Landscape tweaks ────────────────────────────────────────── */
  @media (orientation: landscape) {
    #app {
      display: none; /* re-shown by JS */
      flex-direction: row;
      flex-wrap: wrap;
      align-content: flex-start;
    }

    #header                { width: 100%; }
    #load-error            { width: 100%; }
    #ceo-actions-panel     { width: 100%; }
    #ops-strip             { width: 100%; }
    #active-panel          { flex: 1; min-width: 200px; }
    #queue-panel           { flex: 1; min-width: 200px; }
    #directors-panel       { width: 100%; }

    #backlog-client-panel  { flex: 1; min-width: 200px; }
    #backlog-digital-panel { flex: 1; min-width: 200px; }
  }
</style>
</head>
<body>

<!-- ── Auth overlay ─────────────────────────────────────────────── -->
<div id="auth-overlay" role="main">
  <h1>JasonOS</h1>
  <form id="auth-form" autocomplete="off">
    <input id="auth-input" type="password" placeholder="Access code"
           autocomplete="current-password" autocorrect="off"
           autocapitalize="none" spellcheck="false">
    <button id="auth-btn" type="submit">Unlock</button>
    <div id="auth-error" aria-live="polite"></div>
  </form>
</div>

<!-- ── Main app ──────────────────────────────────────────────────── -->
<div id="app" role="main" aria-label="JasonOS Digital Office Status">

  <!-- Header -->
  <div id="header">
    <div id="header-title">JasonOS</div>
    <div id="header-meta">
      <div id="last-updated">—</div>
      <div id="staleness-badge">STALE</div>
    </div>
  </div>

  <!-- Error -->
  <div id="load-error">Could not load status. Retrying in 15 minutes.</div>

  <!-- CEO Actions -->
  <div id="ceo-actions-panel" class="panel">
    <div class="panel-label">CEO Actions</div>
    <div id="ceo-actions-body"></div>
  </div>

  <!-- Ops Strip -->
  <div id="ops-strip">
    <div class="ops-tile">
      <div class="ops-value" id="tile-session-val">—</div>
      <div class="ops-label">Last Session</div>
    </div>
    <div class="ops-tile">
      <div class="ops-value" id="tile-airlock-val">—</div>
      <div class="ops-label">Airlock</div>
    </div>
    <div class="ops-tile">
      <div class="ops-value" id="tile-active-val">—</div>
      <div class="ops-label">Current</div>
    </div>
    <div class="ops-tile">
      <div class="ops-value" id="tile-queued-val">—</div>
      <div class="ops-label">Queued</div>
    </div>
    <div class="ops-tile">
      <div class="ops-value" id="tile-portfolio-val">—</div>
      <div class="ops-label">Complete</div>
    </div>
  </div>

  <!-- Current Initiative -->
  <div id="active-panel" class="panel">
    <div class="panel-label">Current</div>
    <div id="active-body"></div>
  </div>

  <!-- Next Queue -->
  <div id="queue-panel" class="panel">
    <div class="panel-label">Next</div>
    <div id="queue-body"></div>
  </div>

  <!-- Director Activity -->
  <div id="directors-panel" class="panel">
    <div class="panel-label">Director Activity</div>
    <div id="directors-body"></div>
  </div>

  <!-- Backlog: Client Work -->
  <div id="backlog-client-panel" class="panel">
    <div class="panel-label">Client Work Backlog</div>
    <div id="backlog-client-body"></div>
  </div>

  <!-- Backlog: Digital Office -->
  <div id="backlog-digital-panel" class="panel">
    <div class="panel-label">Digital Office Backlog</div>
    <div id="backlog-digital-body"></div>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ── Config ──────────────────────────────────────────────────── */
  var PASSWORD_HASH = "9ceac6324484d9a021adce9f1d6ed97b1dbdb0a68bb45b856edb9cdaf587fa2e";
  var STATUS_URL    = "status.json";
  var REFRESH_MS    = 15 * 60 * 1000;
  var STALE_MS      = 2  * 60 * 60 * 1000;

  /* ── Auth ────────────────────────────────────────────────────── */
  var authOverlay = document.getElementById("auth-overlay");
  var app         = document.getElementById("app");
  var authForm    = document.getElementById("auth-form");
  var authInput   = document.getElementById("auth-input");
  var authError   = document.getElementById("auth-error");

  function hexFromBuffer(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }

  function unlock() {
    authOverlay.style.display = "none";
    app.style.display = "flex";
    sessionStorage.setItem("jasonos_auth", "1");
    loadStatus();
    scheduleRefresh();
  }

  function checkSession() {
    if (sessionStorage.getItem("jasonos_auth") === "1") { unlock(); return true; }
    return false;
  }

  authForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = authInput.value;
    if (!pw) return;
    authError.textContent = "";
    if (!window.crypto || !window.crypto.subtle) {
      authError.textContent = "Authentication requires HTTPS.";
      return;
    }
    var encoded = new TextEncoder().encode(pw);
    window.crypto.subtle.digest("SHA-256", encoded).then(function (buf) {
      if (hexFromBuffer(buf) === PASSWORD_HASH) {
        unlock();
      } else {
        authError.textContent = "Incorrect access code.";
        authInput.value = "";
        authInput.focus();
      }
    }).catch(function () {
      authError.textContent = "Authentication error.";
    });
  });

  /* ── Status loading ──────────────────────────────────────────── */
  var loadErrorEl    = document.getElementById("load-error");
  var lastUpdatedEl  = document.getElementById("last-updated");
  var stalenessBadge = document.getElementById("staleness-badge");

  function formatTimestamp(iso) {
    try {
      var d   = new Date(iso);
      var day = d.getDate();
      var mon = d.toLocaleDateString(undefined, { month: "short" });
      var hh  = String(d.getHours()).padStart(2, "0");
      var mm  = String(d.getMinutes()).padStart(2, "0");
      return day + " " + mon + " \xb7 " + hh + ":" + mm;
    } catch (e) { return iso; }
  }

  function checkStaleness(generatedAt) {
    try {
      var age = Date.now() - new Date(generatedAt).getTime();
      stalenessBadge.style.display = age > STALE_MS ? "inline-block" : "none";
    } catch (e) { stalenessBadge.style.display = "none"; }
  }

  /* ── Renderers ───────────────────────────────────────────────── */

  /* Map generator category values to display labels and card modifier classes.
     Any unknown category falls back gracefully (badge class = "badge-" + cat,
     card modifier omitted). */
  var BADGE_LABELS = {
    required: "REQUIRED",
    low:      "LOW",
    confirm:  "CONFIRM",
    info:     "INFO",
    action:   "ACTION"
  };
  var CARD_MODIFIERS = {
    required: "",
    low:      "priority-low",
    confirm:  "priority-confirm",
    info:     "priority-confirm"
  };

  function renderCeoActions(actions) {
    var panel = document.getElementById("ceo-actions-panel");
    var body  = document.getElementById("ceo-actions-body");
    if (!actions || actions.length === 0) {
      panel.classList.add("empty");
      body.innerHTML = '<span class="no-actions">No action required</span>';
      return;
    }
    panel.classList.remove("empty");
    var html = "";
    for (var i = 0; i < actions.length; i++) {
      var a   = actions[i];
      var cat = a.category || "required";
      var mod = CARD_MODIFIERS.hasOwnProperty(cat) ? CARD_MODIFIERS[cat] : "";
      var cardCls = "action-card" + (mod ? " " + mod : "");
      html += '<div class="' + cardCls + '">';
      /* Badge: category-specific class + human-readable label */
      var badgeTxt = BADGE_LABELS.hasOwnProperty(cat)
                     ? BADGE_LABELS[cat]
                     : escHtml(cat).toUpperCase();
      html += '<div class="action-category badge-' + escHtml(cat) + '">' + badgeTxt + '</div>';
      html += '<div class="action-label">' + escHtml(a.label || "") + '</div>';
      if (a.context) {
        html += '<div class="action-context">' + escHtml(a.context) + '</div>';
      }
      html += '</div>';
    }
    body.innerHTML = html;
  }

  function renderOpsStrip(stats, operational) {
    var op = operational || {};
    var s  = stats || {};

    // Last session
    var sessionEl = document.getElementById("tile-session-val");
    var mins      = (op.minutes_since_session !== null && op.minutes_since_session !== undefined)
                    ? op.minutes_since_session : null;
    if (mins === null) {
      sessionEl.textContent = "—";
      sessionEl.className   = "ops-value muted";
    } else {
      var sesHours = Math.floor(mins / 60);
      var sesDays  = Math.floor(mins / 1440);
      var label, cls;
      if (mins < 60) {
        label = mins + "m ago";   cls = "ops-value success";
      } else if (sesHours < 24) {
        label = sesHours + "h " + (mins % 60) + "m ago";  cls = "ops-value success";
      } else if (sesDays === 1) {
        label = "Yesterday";  cls = "ops-value";
      } else {
        label = sesDays + "d";
        cls   = "ops-value" + (sesDays > 7 ? " warn" : "");
      }
      sessionEl.textContent = label;
      sessionEl.className   = cls;
    }

    // Airlock
    var airlockEl = document.getElementById("tile-airlock-val");
    var airlock   = op.airlock_queue || 0;
    airlockEl.textContent = airlock;
    airlockEl.className   = "ops-value" + (airlock > 0 ? " warn" : " muted");

    // Active
    var activeEl = document.getElementById("tile-active-val");
    activeEl.textContent = (s.active != null) ? s.active : "—";
    activeEl.className   = (s.active > 0) ? "ops-value accent" : "ops-value muted";

    // Queued
    document.getElementById("tile-queued-val").textContent =
      (s.queued != null) ? s.queued : "—";

    // Complete
    var done  = s.done  || 0;
    var total = s.total || 0;
    document.getElementById("tile-portfolio-val").textContent =
      total > 0 ? done + "/" + total : "—";
  }

  function renderActive(initiative, initiatives) {
    var body = document.getElementById("active-body");
    // Prefer the full list (schema v3); fall back to the singular field.
    var list = (initiatives && initiatives.length)
             ? initiatives
             : (initiative ? [initiative] : []);
    if (list.length === 0) {
      body.innerHTML = '<span class="status-none">None.</span>';
      return;
    }
    var html = "";
    for (var i = 0; i < list.length; i++) {
      html += '<div class="active-item"' + (i > 0 ? ' style="margin-top:14px"' : '') + '>'
            +   '<div class="initiative-id">'   + escHtml(list[i].id)   + '</div>'
            +   '<div class="initiative-name">' + escHtml(list[i].name) + '</div>'
            +   '<span class="initiative-status status-active">In Progress</span>'
            + '</div>';
    }
    body.innerHTML = html;
  }

  function renderQueue(queue) {
    var body    = document.getElementById("queue-body");
    var display = queue || [];
    if (display.length === 0) {
      body.innerHTML = '<span class="queue-empty">Queue is empty</span>';
      return;
    }
    var html = "";
    for (var i = 0; i < display.length; i++) {
      var item = display[i];
      html += '<div class="queue-item">'
            + '<span class="queue-pos">'  + escHtml(String(item.position)) + '</span>'
            + '<span class="queue-id">'   + escHtml(item.id)               + '</span>'
            + '<span class="queue-name">' + escHtml(item.name)             + '</span>'
            + '</div>';
    }
    body.innerHTML = html;
  }

  function renderDirectors(directors) {
    var body = document.getElementById("directors-body");
    if (!directors || directors.length === 0) {
      body.innerHTML = '<span class="queue-empty">No director data</span>';
      return;
    }
    var sorted = directors.slice().sort(function (a, b) {
      if (a.last_active && b.last_active) return new Date(b.last_active) - new Date(a.last_active);
      if (a.last_active) return -1;
      if (b.last_active) return 1;
      return 0;
    });
    var html = "";
    for (var i = 0; i < sorted.length; i++) {
      var d     = sorted[i];
      var isActive = d.last_active != null;
      var count = d.invocations_30d || 0;
      html += '<div class="director-row">'
            + '<span class="director-dot ' + (isActive ? "active" : "dormant") + '"></span>'
            + '<span class="director-name' + (isActive ? "" : " dormant")      + '">' + escHtml(d.display) + '</span>'
            + '<span class="director-date">' + fmtRelative(d.last_active)      + '</span>'
            + '<span class="director-count">' + (count > 0 ? count + "\xd7" : "") + '</span>'
            + '</div>';
    }
    body.innerHTML = html;
  }

  function renderBacklog(items, bodyId) {
    var body = document.getElementById(bodyId);
    if (!items || items.length === 0) {
      body.innerHTML = '<span class="backlog-empty">Empty</span>';
      return;
    }
    var html = "";
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var nameWrap = '<div class="backlog-name-wrap">'
                   + '<span class="backlog-name">' + escHtml(item.name) + '</span>';
      if (item.notes) {
        nameWrap += '<span class="backlog-note">' + escHtml(item.notes) + '</span>';
      }
      nameWrap += '</div>';
      html += '<div class="backlog-item">'
            + '<span class="backlog-id">' + escHtml(item.id) + '</span>'
            + nameWrap
            + '</div>';
    }
    body.innerHTML = html;
  }

  /* ── Master render ───────────────────────────────────────────── */
  function render(data) {
    loadErrorEl.style.display = "none";
    lastUpdatedEl.textContent = data.generated_at
      ? formatTimestamp(data.generated_at) : "Unknown";
    checkStaleness(data.generated_at);
    renderCeoActions(data.ceo_actions);
    renderOpsStrip(data.stats, data.operational);
    renderActive(data.active_initiative, data.active_initiatives);
    renderQueue(data.queue);
    renderDirectors(data.directors);
    var backlog = data.backlog || {};
    renderBacklog(backlog.client_work,    "backlog-client-body");
    renderBacklog(backlog.digital_office, "backlog-digital-body");
  }

  /* ── Fetch & schedule ────────────────────────────────────────── */
  var lastLoadTime = 0;
  var MIN_REVISIT_MS = 5 * 60 * 1000; // skip re-fetch if loaded within 5 min

  function loadStatus() {
    lastLoadTime = Date.now();
    fetch(STATUS_URL + "?t=" + lastLoadTime)
      .then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      })
      .then(function (data) { render(data); })
      .catch(function () { loadErrorEl.style.display = "block"; });
  }

  function scheduleRefresh() {
    // Periodic timer (fires when tab stays visible)
    setInterval(loadStatus, REFRESH_MS);

    // Visibility-based refresh — handles iOS Safari backgrounding/throttling.
    // Fires when the user returns to the tab after it was hidden.
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" &&
          Date.now() - lastLoadTime >= MIN_REVISIT_MS) {
        loadStatus();
      }
    });

    // bfcache restore — fires when Safari restores a frozen page snapshot.
    window.addEventListener("pageshow", function (e) {
      if (e.persisted && Date.now() - lastLoadTime >= MIN_REVISIT_MS) {
        loadStatus();
      }
    });
  }

  /* ── Utility ─────────────────────────────────────────────────── */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  /**
   * Format an ISO timestamp as a human-readable relative label.
   * < 24 h  → "Xh Ym ago" (or "Xm ago" if under 1 h)
   * 1 day   → "Yesterday"
   * < 14 d  → "X days ago"
   * ≥ 14 d  → "6 Jun"
   */
  function fmtRelative(isoStr) {
    if (!isoStr) return "—";
    try {
      var d    = new Date(isoStr);
      var now  = Date.now();
      var ms   = now - d.getTime();
      if (isNaN(ms)) return isoStr;
      if (ms < 0) ms = 0;
      var mins  = Math.floor(ms / 60000);
      var hours = Math.floor(mins / 60);
      var days  = Math.floor(ms / 86400000);
      if (mins < 60)  return mins + "m ago";
      if (hours < 24) return hours + "h " + (mins % 60) + "m ago";
      if (days === 1) return "Yesterday";
      if (days < 14)  return days + " days ago";
      return d.getDate() + " " + d.toLocaleDateString(undefined, { month: "short" });
    } catch (e) { return isoStr; }
  }

  /* ── Init ────────────────────────────────────────────────────── */
  if (!checkSession()) { authInput.focus(); }

}());
</script>
