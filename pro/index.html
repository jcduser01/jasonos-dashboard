<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JasonOS — Digital Office Status (Pro)</title>
<style>
  /* ── Custom properties ───────────────────────────────────────── */
  :root {
    --bg:          #0d0d0d;
    --surface:     #1a1a1a;
    --surface-2:   #242424;
    --border:      #2e2e2e;
    --text:        #f2f2f2;
    --text-muted:  #a0a0a0;
    --text-dim:    #6a6a6a;
    --accent:      #4a9eff;
    --warn:        #ff9f40;
    --danger:      #ff5f5f;
    --success:     #4caf7d;
    --radius:      10px;
    --gap:         16px;
    --rail:        clamp(360px, 25vw, 470px);
    --maxw:        2100px;
    color-scheme: dark;
  }

  /* ── Light theme overrides ───────────────────────────────────── */
  :root[data-theme="light"] {
    --bg:          #eef1f5;
    --surface:     #ffffff;
    --surface-2:   #f1f3f7;
    --border:      #d7dce3;
    --text:        #1a1d22;
    --text-muted:  #5a626d;
    --text-dim:    #8b929c;
    --accent:      #1f6feb;
    --warn:        #b76b00;
    --danger:      #d12f2f;
    --success:     #1f7a4d;
    color-scheme: light;
  }

  /* ── Reset ───────────────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
    font-size: 16px;
    line-height: 1.45;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Auth overlay ────────────────────────────────────────────── */
  #auth-overlay {
    position: fixed; inset: 0;
    background: var(--bg);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 100; gap: 20px;
  }
  #auth-overlay h1 {
    font-size: 1.15rem; font-weight: 500;
    color: var(--text-muted);
    letter-spacing: 0.08em; text-transform: uppercase;
  }
  #auth-form {
    display: flex; flex-direction: column; align-items: stretch;
    gap: 12px; width: min(300px, 80vw);
  }
  #auth-input {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text);
    font-size: 1rem; padding: 12px 16px; outline: none;
    -webkit-appearance: none; appearance: none;
  }
  #auth-input:focus { border-color: var(--accent); }
  #auth-btn {
    background: var(--accent); border: none; border-radius: var(--radius);
    color: #fff; cursor: pointer; font-size: 0.95rem; font-weight: 600;
    padding: 12px; -webkit-appearance: none; appearance: none;
  }
  #auth-error {
    color: var(--danger); font-size: 0.85rem;
    text-align: center; min-height: 1.2em;
  }

  /* ── App shell : main + sticky rail ──────────────────────────── */
  #app {
    display: none;                /* re-shown (flex) by JS */
    align-items: flex-start;
    gap: var(--gap);
    padding: var(--gap) clamp(var(--gap), 2vw, 40px);
    max-width: var(--maxw);
    margin: 0 auto;
  }

  #main {
    flex: 1 1 auto;
    min-width: 0;                 /* allow inner grids to shrink + truncate */
    display: flex; flex-direction: column;
    gap: var(--gap);
  }

  #rail {
    flex: 0 0 var(--rail);
    position: sticky; top: var(--gap);
    display: flex; flex-direction: column;
    gap: var(--gap);
  }

  /* ── Header strip ────────────────────────────────────────────── */
  #header {
    display: flex; align-items: center;
    justify-content: space-between; gap: 12px;
  }
  #header-left  { display: flex; align-items: baseline; gap: 12px; }
  #header-right { display: flex; align-items: center; gap: 14px; }
  #header-title {
    font-size: 1.25rem; font-weight: 700; letter-spacing: 0.02em;
    color: var(--text);
  }
  #header-sub {
    font-size: 0.66rem; font-weight: 700; letter-spacing: 0.16em;
    text-transform: uppercase; color: var(--text-dim);
  }
  #header-meta { text-align: right; font-size: 0.8rem; color: var(--text-muted); }
  #staleness-badge {
    display: none; font-size: 0.7rem; font-weight: 700;
    background: var(--warn); color: #000;
    padding: 2px 7px; border-radius: 4px; margin-left: 8px;
  }

  /* ── Theme toggle ────────────────────────────────────────────── */
  #theme-toggle {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-muted);
    cursor: pointer; padding: 7px; line-height: 0;
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  #theme-toggle:hover { color: var(--text); border-color: var(--accent); }
  #theme-toggle svg { width: 17px; height: 17px; display: block; }
  .icon-moon { display: none; }
  :root[data-theme="light"] .icon-sun  { display: none; }
  :root[data-theme="light"] .icon-moon { display: block; }

  /* ── Cards / panels ──────────────────────────────────────────── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
  }
  .panel-label {
    font-size: 0.7rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--text-dim);
    margin-bottom: 12px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .panel-count {
    font-size: 0.7rem; font-weight: 700;
    color: var(--text-dim); margin-left: auto;
    font-variant-numeric: tabular-nums;
  }

  /* ── Ops / KPI strip ─────────────────────────────────────────── */
  #ops-strip {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 12px;
  }
  .ops-tile {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 10px; text-align: center;
  }
  .ops-value {
    font-size: 1.7rem; font-weight: 700;
    font-variant-numeric: tabular-nums;
    color: var(--text); line-height: 1.1;
  }
  .ops-value.accent  { color: var(--accent); }
  .ops-value.success { color: var(--success); }
  .ops-value.warn    { color: var(--warn); }
  .ops-value.muted   { color: var(--text-muted); }
  .ops-label {
    font-size: 0.62rem; font-weight: 700; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--text-dim);
    margin-top: 6px; line-height: 1.3;
  }

  /* ── Current (hero cards) ────────────────────────────────────── */
  #active-panel .panel-label { color: var(--accent); }
  #active-body {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
    gap: 12px;
  }
  .active-item {
    background: var(--surface-2);
    border-left: 3px solid var(--accent);
    border-radius: 8px;
    padding: 13px 15px;
    margin-top: 0 !important;     /* neutralize legacy inline stacking margin */
  }
  .initiative-id {
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em;
    color: var(--accent); margin-bottom: 5px;
  }
  .initiative-name {
    font-size: 1rem; font-weight: 500; color: var(--text); line-height: 1.35;
  }
  .initiative-status {
    display: inline-block; font-size: 0.62rem; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    padding: 2px 7px; border-radius: 4px; margin-top: 8px;
  }
  .status-active { background: rgba(74, 158, 255, 0.15); color: var(--accent); }
  .status-next   { background: rgba(76, 175, 125, 0.15); color: var(--success); }
  .status-none   { color: var(--text-muted); font-size: 0.9rem; }

  /* ── Lower zone (queue / paused / backlog) ───────────────────── */
  /* Organized by work type: each backlog owns a column with its matching
     Paused panel stacked beneath it. Column 1 = Next; column 2 = Client
     backlog + Paused client; column 3 = Infrastructure backlog + Paused infra. */
  #lower-grid {
    display: flex;
    flex-wrap: wrap;
    gap: var(--gap);
    align-items: flex-start;
  }
  .lcol {
    flex: 1 1 320px;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
  }

  /* Queue */
  #queue-panel .panel-label { color: var(--success); }
  .queue-item {
    display: flex; align-items: baseline; gap: 10px;
    padding: 7px 0; border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .queue-item:last-child  { border-bottom: none; padding-bottom: 0; }
  .queue-item:first-child { padding-top: 0; }
  .queue-pos  { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); min-width: 18px; text-align: right; }
  .queue-id   { font-size: 0.8rem; font-weight: 700; color: var(--text-muted); min-width: 62px; }
  .queue-name { color: var(--text); flex: 1; font-weight: 500; }
  .queue-empty { font-size: 0.9rem; color: var(--text-muted); }

  /* Backlog + paused lists */
  .backlog-item {
    display: flex; align-items: flex-start; gap: 10px;
    padding: 6px 0; border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
  }
  .backlog-item:last-child  { border-bottom: none; padding-bottom: 0; }
  .backlog-item:first-child { padding-top: 0; }
  .backlog-id        { font-size: 0.75rem; font-weight: 700; color: var(--text-dim); min-width: 62px; padding-top: 1px; }
  .backlog-name-wrap { flex: 1; min-width: 0; }
  .backlog-name      { color: var(--text-muted); font-size: 0.875rem; display: block; }
  .backlog-note      { color: var(--text-dim); font-size: 0.74rem; margin-top: 2px; display: block; }
  .backlog-empty     { font-size: 0.875rem; color: var(--text-dim); }

  #paused-client-panel .panel-label,
  #paused-infra-panel  .panel-label { color: var(--warn); }

  /* ── Rail : CEO Actions (pinned) ─────────────────────────────── */
  #ceo-actions-panel { border-color: var(--warn); }
  #ceo-actions-panel .panel-label { color: var(--warn); }
  #ceo-actions-panel.empty { border-color: var(--border); }
  #ceo-actions-panel.empty .panel-label { color: var(--text-dim); }

  .action-card {
    background: var(--surface-2);
    border-left: 3px solid var(--warn);
    border-radius: 6px; padding: 11px 13px; margin-bottom: 9px;
  }
  .action-card:last-child { margin-bottom: 0; }
  .action-card.priority-low  { border-left-color: var(--border); opacity: 0.8; }
  .action-card.priority-confirm { border-left-color: var(--accent); }

  .action-category {
    display: inline-block; font-size: 0.62rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    padding: 1px 6px; border-radius: 3px; margin-bottom: 5px;
  }
  .badge-required { background: rgba(255, 159, 64, 0.15); color: var(--warn); }
  .badge-low      { background: rgba(106, 106, 106, 0.15); color: var(--text-dim); }
  .badge-confirm,
  .badge-info     { background: rgba(74, 158, 255, 0.12); color: var(--accent); }
  .badge-action   { background: rgba(76, 175, 125, 0.12); color: var(--success); }

  .action-label   { font-size: 0.95rem; font-weight: 600; color: var(--text); line-height: 1.4; }
  .action-context { font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; }
  .no-actions     { font-size: 0.9rem; color: var(--text-muted); }

  /* ── Rail : Director Activity ────────────────────────────────── */
  .director-row {
    display: flex; align-items: center; gap: 9px;
    padding: 7px 0; border-bottom: 1px solid var(--border);
  }
  .director-row:last-child  { border-bottom: none; padding-bottom: 0; }
  .director-row:first-child { padding-top: 0; }
  .director-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .director-dot.active  { background: var(--success); }
  .director-dot.dormant { background: var(--text-dim); }
  .director-name { flex: 1; font-size: 0.9rem; font-weight: 500; color: var(--text); }
  .director-name.dormant { color: var(--text-muted); }
  .director-date  { font-size: 0.8rem; color: var(--text-muted); font-variant-numeric: tabular-nums; min-width: 64px; text-align: right; }
  .director-count { font-size: 0.75rem; color: var(--text-dim); min-width: 26px; text-align: right; }

  /* ── Error state ─────────────────────────────────────────────── */
  #load-error {
    display: none;
    background: rgba(255, 95, 95, 0.08);
    border: 1px solid var(--danger);
    border-radius: var(--radius);
    padding: 14px 16px; font-size: 0.85rem; color: var(--danger);
  }

  /* ── Responsive : collapse rail below main ───────────────────── */
  @media (max-width: 1180px) {
    #app { flex-direction: column; }
    #rail { position: static; flex-basis: auto; width: 100%; }
    #ops-strip { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  }
  @media (max-width: 560px) {
    #ops-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    #header { flex-direction: column; align-items: flex-start; gap: 4px; }
    #header-meta { text-align: left; }
  }
</style>
</head>
<body>

<!-- ── Auth overlay ─────────────────────────────────────────────── -->
<div id="auth-overlay" role="main">
  <h1>JasonOS</h1>
  <form id="auth-form" autocomplete="off">
    <input id="auth-input" type="password" placeholder="Access code"
           autocomplete="current-password" autocorrect="off"
           autocapitalize="none" spellcheck="false">
    <button id="auth-btn" type="submit">Unlock</button>
    <div id="auth-error" aria-live="polite"></div>
  </form>
</div>

<!-- ── Main app (Pro / widescreen) ──────────────────────────────── -->
<div id="app" role="main" aria-label="JasonOS Digital Office Status">

  <!-- LEFT : main column -->
  <div id="main">

    <div id="header">
      <div id="header-left">
        <div id="header-title">JasonOS</div>
        <div id="header-sub">Executive Briefing</div>
      </div>
      <div id="header-right">
        <div id="header-meta">
          <span id="last-updated">—</span>
          <span id="staleness-badge">STALE</span>
        </div>
        <button id="theme-toggle" type="button" aria-label="Toggle light or dark theme" title="Toggle light / dark">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
      </div>
    </div>

    <div id="load-error">Could not load status. Retrying in 15 minutes.</div>

    <!-- KPI strip -->
    <div id="ops-strip">
      <div class="ops-tile"><div class="ops-value" id="tile-session-val">—</div><div class="ops-label">Last Session</div></div>
      <div class="ops-tile"><div class="ops-value" id="tile-airlock-val">—</div><div class="ops-label">Airlock</div></div>
      <div class="ops-tile"><div class="ops-value" id="tile-active-val">—</div><div class="ops-label">Current</div></div>
      <div class="ops-tile"><div class="ops-value" id="tile-queued-val">—</div><div class="ops-label">Queued</div></div>
      <div class="ops-tile"><div class="ops-value" id="tile-paused-val">—</div><div class="ops-label">Paused</div></div>
      <div class="ops-tile"><div class="ops-value" id="tile-portfolio-val">—</div><div class="ops-label">Complete</div></div>
    </div>

    <!-- Current (hero) -->
    <div id="active-panel" class="panel">
      <div class="panel-label">Current</div>
      <div id="active-body"></div>
    </div>

    <!-- Lower zone, organized by work type: column 1 = Next;
         column 2 = Client backlog + Paused client work;
         column 3 = Infrastructure backlog + Paused infrastructure. -->
    <div id="lower-grid">

      <div class="lcol">
        <div id="queue-panel" class="panel">
          <div class="panel-label">Next</div>
          <div id="queue-body"></div>
        </div>
      </div>

      <div class="lcol">
        <div id="backlog-client-panel" class="panel">
          <div class="panel-label">Client Work Backlog</div>
          <div id="backlog-client-body"></div>
        </div>

        <div id="paused-client-panel" class="panel" style="display:none;">
          <div class="panel-label">Paused — Client Work</div>
          <div id="paused-client-body"></div>
        </div>
      </div>

      <div class="lcol">
        <div id="backlog-digital-panel" class="panel">
          <div class="panel-label">Infrastructure Backlog</div>
          <div id="backlog-digital-body"></div>
        </div>

        <div id="paused-infra-panel" class="panel" style="display:none;">
          <div class="panel-label">Paused — Infrastructure</div>
          <div id="paused-infra-body"></div>
        </div>
      </div>

    </div>

  </div><!-- /#main -->

  <!-- RIGHT : pinned rail -->
  <div id="rail">
    <div id="ceo-actions-panel" class="panel">
      <div class="panel-label">CEO Actions</div>
      <div id="ceo-actions-body"></div>
    </div>

    <div id="directors-panel" class="panel">
      <div class="panel-label">Director Activity</div>
      <div id="directors-body"></div>
    </div>
  </div>

</div>

<script>
(function () {
  "use strict";

  /* ── Config ──────────────────────────────────────────────────── */
  var PASSWORD_HASH = "9ceac6324484d9a021adce9f1d6ed97b1dbdb0a68bb45b856edb9cdaf587fa2e";
  var STATUS_URL    = "../status.json";          /* pro/ lives one level below the artifact */
  var REFRESH_MS    = 15 * 60 * 1000;
  var STALE_MS      = 2  * 60 * 60 * 1000;

  /* ── Theme (light / dark) ────────────────────────────────────── */
  var THEME_KEY    = "jasonos_theme";
  var themeToggle  = document.getElementById("theme-toggle");

  function applyTheme(t) {
    if (t === "light") { document.documentElement.setAttribute("data-theme", "light"); }
    else               { document.documentElement.removeAttribute("data-theme"); }
  }

  function initTheme() {
    var saved = null;
    try { saved = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (saved === "light" || saved === "dark") { applyTheme(saved); return; }
    var prefersLight = window.matchMedia &&
                       window.matchMedia("(prefers-color-scheme: light)").matches;
    applyTheme(prefersLight ? "light" : "dark");
  }

  if (themeToggle) {
    themeToggle.addEventListener("click", function () {
      var isLight = document.documentElement.getAttribute("data-theme") === "light";
      var next = isLight ? "dark" : "light";
      applyTheme(next);
      try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    });
  }

  initTheme();

  /* ── Auth ────────────────────────────────────────────────────── */
  var authOverlay = document.getElementById("auth-overlay");
  var app         = document.getElementById("app");
  var authForm    = document.getElementById("auth-form");
  var authInput   = document.getElementById("auth-input");
  var authError   = document.getElementById("auth-error");

  function hexFromBuffer(buf) {
    return Array.prototype.map.call(new Uint8Array(buf), function (b) {
      return b.toString(16).padStart(2, "0");
    }).join("");
  }

  function unlock() {
    authOverlay.style.display = "none";
    app.style.display = "flex";
    sessionStorage.setItem("jasonos_auth", "1");
    loadStatus();
    scheduleRefresh();
  }

  function checkSession() {
    if (sessionStorage.getItem("jasonos_auth") === "1") { unlock(); return true; }
    return false;
  }

  authForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var pw = authInput.value;
    if (!pw) return;
    authError.textContent = "";
    if (!window.crypto || !window.crypto.subtle) {
      authError.textContent = "Authentication requires HTTPS.";
      return;
    }
    var encoded = new TextEncoder().encode(pw);
    window.crypto.subtle.digest("SHA-256", encoded).then(function (buf) {
      if (hexFromBuffer(buf) === PASSWORD_HASH) {
        unlock();
      } else {
        authError.textContent = "Incorrect access code.";
        authInput.value = "";
        authInput.focus();
      }
    }).catch(function () {
      authError.textContent = "Authentication error.";
    });
  });

  /* ── Status loading ──────────────────────────────────────────── */
  var loadErrorEl    = document.getElementById("load-error");
  var lastUpdatedEl  = document.getElementById("last-updated");
  var stalenessBadge = document.getElementById("staleness-badge");

  function formatTimestamp(iso) {
    try {
      var d   = new Date(iso);
      var day = d.getDate();
      var mon = d.toLocaleDateString(undefined, { month: "short" });
      var hh  = String(d.getHours()).padStart(2, "0");
      var mm  = String(d.getMinutes()).padStart(2, "0");
      return day + " " + mon + " \xb7 " + hh + ":" + mm;
    } catch (e) { return iso; }
  }

  function checkStaleness(generatedAt) {
    try {
      var age = Date.now() - new Date(generatedAt).getTime();
      stalenessBadge.style.display = age > STALE_MS ? "inline-block" : "none";
    } catch (e) { stalenessBadge.style.display = "none"; }
  }

  /* ── Renderers ───────────────────────────────────────────────── */
  var BADGE_LABELS = {
    required: "REQUIRED", low: "LOW", confirm: "CONFIRM", info: "INFO", action: "ACTION"
  };
  var CARD_MODIFIERS = {
    required: "", low: "priority-low", confirm: "priority-confirm", info: "priority-confirm"
  };

  function renderCeoActions(actions) {
    var panel = document.getElementById("ceo-actions-panel");
    var body  = document.getElementById("ceo-actions-body");
    if (!actions || actions.length === 0) {
      panel.classList.add("empty");
      body.innerHTML = '<span class="no-actions">No action required</span>';
      return;
    }
    panel.classList.remove("empty");
    var html = "";
    for (var i = 0; i < actions.length; i++) {
      var a   = actions[i];
      var cat = a.category || "required";
      var mod = CARD_MODIFIERS.hasOwnProperty(cat) ? CARD_MODIFIERS[cat] : "";
      var cardCls = "action-card" + (mod ? " " + mod : "");
      html += '<div class="' + cardCls + '">';
      var badgeTxt = BADGE_LABELS.hasOwnProperty(cat)
                     ? BADGE_LABELS[cat] : escHtml(cat).toUpperCase();
      html += '<div class="action-category badge-' + escHtml(cat) + '">' + badgeTxt + '</div>';
      html += '<div class="action-label">' + escHtml(a.label || "") + '</div>';
      if (a.context) {
        html += '<div class="action-context">' + escHtml(a.context) + '</div>';
      }
      html += '</div>';
    }
    body.innerHTML = html;
  }

  function renderOpsStrip(stats, operational) {
    var op = operational || {};
    var s  = stats || {};

    var sessionEl = document.getElementById("tile-session-val");
    var mins      = (op.minutes_since_session !== null && op.minutes_since_session !== undefined)
                    ? op.minutes_since_session : null;
    if (mins === null) {
      sessionEl.textContent = "—";
      sessionEl.className   = "ops-value muted";
    } else {
      var sesHours = Math.floor(mins / 60);
      var sesDays  = Math.floor(mins / 1440);
      var label, cls;
      if (mins < 60) {
        label = mins + "m ago";   cls = "ops-value success";
      } else if (sesHours < 24) {
        label = sesHours + "h " + (mins % 60) + "m ago";  cls = "ops-value success";
      } else if (sesDays === 1) {
        label = "Yesterday";  cls = "ops-value";
      } else {
        label = sesDays + "d";
        cls   = "ops-value" + (sesDays > 7 ? " warn" : "");
      }
      sessionEl.textContent = label;
      sessionEl.className   = cls;
    }

    var airlockEl = document.getElementById("tile-airlock-val");
    var airlock   = op.airlock_queue || 0;
    airlockEl.textContent = airlock;
    airlockEl.className   = "ops-value" + (airlock > 0 ? " warn" : " muted");

    var activeEl = document.getElementById("tile-active-val");
    activeEl.textContent = (s.active != null) ? s.active : "—";
    activeEl.className   = (s.active > 0) ? "ops-value accent" : "ops-value muted";

    document.getElementById("tile-queued-val").textContent =
      (s.queued != null) ? s.queued : "—";

    /* Paused tile — reads the existing stats.paused field (no generator change). */
    var pausedEl = document.getElementById("tile-paused-val");
    if (pausedEl) {
      pausedEl.textContent = (s.paused != null) ? s.paused : "—";
      pausedEl.className   = "ops-value" + (s.paused > 0 ? " warn" : " muted");
    }

    var done  = s.done  || 0;
    var total = s.total || 0;
    document.getElementById("tile-portfolio-val").textContent =
      total > 0 ? done + "/" + total : "—";
  }

  function renderActive(initiative, initiatives) {
    var body = document.getElementById("active-body");
    var list = (initiatives && initiatives.length)
             ? initiatives
             : (initiative ? [initiative] : []);
    if (list.length === 0) {
      body.innerHTML = '<span class="status-none">None.</span>';
      return;
    }
    var html = "";
    for (var i = 0; i < list.length; i++) {
      html += '<div class="active-item">'
            +   '<div class="initiative-id">'   + escHtml(list[i].id)   + '</div>'
            +   '<div class="initiative-name">' + escHtml(list[i].name) + '</div>'
            +   '<span class="initiative-status status-active">In Progress</span>'
            + '</div>';
    }
    body.innerHTML = html;
  }

  function renderQueue(queue) {
    var body    = document.getElementById("queue-body");
    var display = queue || [];
    if (display.length === 0) {
      body.innerHTML = '<span class="queue-empty">Queue is empty</span>';
      return;
    }
    var html = "";
    for (var i = 0; i < display.length; i++) {
      var item = display[i];
      html += '<div class="queue-item">'
            + '<span class="queue-pos">'  + escHtml(String(item.position)) + '</span>'
            + '<span class="queue-id">'   + escHtml(item.id)               + '</span>'
            + '<span class="queue-name">' + escHtml(item.name)             + '</span>'
            + '</div>';
    }
    body.innerHTML = html;
  }

  function renderDirectors(directors) {
    var body = document.getElementById("directors-body");
    if (!directors || directors.length === 0) {
      body.innerHTML = '<span class="queue-empty">No director data</span>';
      return;
    }
    var sorted = directors.slice().sort(function (a, b) {
      if (a.last_active && b.last_active) return new Date(b.last_active) - new Date(a.last_active);
      if (a.last_active) return -1;
      if (b.last_active) return 1;
      return 0;
    });
    var html = "";
    for (var i = 0; i < sorted.length; i++) {
      var d     = sorted[i];
      var isActive = d.last_active != null;
      var count = d.invocations_30d || 0;
      html += '<div class="director-row">'
            + '<span class="director-dot ' + (isActive ? "active" : "dormant") + '"></span>'
            + '<span class="director-name' + (isActive ? "" : " dormant")      + '">' + escHtml(d.display) + '</span>'
            + '<span class="director-date">' + fmtRelative(d.last_active)      + '</span>'
            + '<span class="director-count">' + (count > 0 ? count + "\xd7" : "") + '</span>'
            + '</div>';
    }
    body.innerHTML = html;
  }

  function renderBacklog(items, bodyId) {
    var body = document.getElementById(bodyId);
    if (!items || items.length === 0) {
      body.innerHTML = '<span class="backlog-empty">Empty</span>';
      return;
    }
    var html = "";
    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      var nameWrap = '<div class="backlog-name-wrap">'
                   + '<span class="backlog-name">' + escHtml(item.name) + '</span>';
      if (item.notes) {
        nameWrap += '<span class="backlog-note">' + escHtml(item.notes) + '</span>';
      }
      nameWrap += '</div>';
      html += '<div class="backlog-item">'
            + '<span class="backlog-id">' + escHtml(item.id) + '</span>'
            + nameWrap
            + '</div>';
    }
    body.innerHTML = html;
  }

  /* Paused — own panels, split by category, shown only when populated. */
  function renderPaused(paused) {
    var groups = [
      { items: paused.client_work,                          panel: "paused-client-panel", body: "paused-client-body" },
      { items: paused.infrastructure || paused.digital_office, panel: "paused-infra-panel",  body: "paused-infra-body" }
    ];
    groups.forEach(function (g) {
      var items = g.items || [];
      var panelEl = document.getElementById(g.panel);
      if (panelEl) panelEl.style.display = items.length ? "" : "none";
      if (items.length) renderBacklog(items, g.body);
    });
  }

  /* ── Master render ───────────────────────────────────────────── */
  function render(data) {
    loadErrorEl.style.display = "none";
    lastUpdatedEl.textContent = data.generated_at
      ? formatTimestamp(data.generated_at) : "Unknown";
    checkStaleness(data.generated_at);
    renderCeoActions(data.ceo_actions);
    renderOpsStrip(data.stats, data.operational);
    renderActive(data.active_initiative, data.active_initiatives);
    renderQueue(data.queue);
    renderDirectors(data.directors);
    renderPaused(data.paused || {});
    var backlog = data.backlog || {};
    renderBacklog(backlog.client_work,                              "backlog-client-body");
    renderBacklog(backlog.infrastructure || backlog.digital_office, "backlog-digital-body");
  }

  /* ── Fetch & schedule ────────────────────────────────────────── */
  var lastLoadTime = 0;
  var MIN_REVISIT_MS = 5 * 60 * 1000;

  function loadStatus() {
    lastLoadTime = Date.now();
    fetch(STATUS_URL + "?t=" + lastLoadTime)
      .then(function (res) {
        if (!res.ok) { throw new Error("HTTP " + res.status); }
        return res.json();
      })
      .then(function (data) { render(data); })
      .catch(function () { loadErrorEl.style.display = "block"; });
  }

  function scheduleRefresh() {
    setInterval(loadStatus, REFRESH_MS);
    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" &&
          Date.now() - lastLoadTime >= MIN_REVISIT_MS) {
        loadStatus();
      }
    });
    window.addEventListener("pageshow", function (e) {
      if (e.persisted && Date.now() - lastLoadTime >= MIN_REVISIT_MS) {
        loadStatus();
      }
    });
  }

  /* ── Utility ─────────────────────────────────────────────────── */
  function escHtml(str) {
    return String(str)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function fmtRelative(isoStr) {
    if (!isoStr) return "—";
    try {
      var d    = new Date(isoStr);
      var now  = Date.now();
      var ms   = now - d.getTime();
      if (isNaN(ms)) return isoStr;
      if (ms < 0) ms = 0;
      var mins  = Math.floor(ms / 60000);
      var hours = Math.floor(mins / 60);
      var days  = Math.floor(ms / 86400000);
      if (mins < 60)  return mins + "m ago";
      if (hours < 24) return hours + "h " + (mins % 60) + "m ago";
      if (days === 1) return "Yesterday";
      if (days < 14)  return days + " days ago";
      return d.getDate() + " " + d.toLocaleDateString(undefined, { month: "short" });
    } catch (e) { return isoStr; }
  }

  /* ── Init ────────────────────────────────────────────────────── */
  if (!checkSession()) { authInput.focus(); }

}());
</script>
</body>
</html>
